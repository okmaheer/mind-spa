<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="Life percentage bar showing years lived versus years remaining based on average life expectancy of 73 years">
  <rect width="640" height="110" fill="#0f172a" rx="12"/>
  <text x="320" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Your Life Timeline — Based on Global Average Expectancy (73 years)</text>
  <!-- bar -->
  <rect x="20" y="34" width="600" height="30" rx="6" fill="#1e293b"/>
  <rect x="20" y="34" width="329" height="30" rx="6 0 0 6" fill="#6366f1"/>
  <text x="175" y="54" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">Years Lived</text>
  <text x="505" y="54" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" fill="#94a3b8">Years Remaining</text>
  <!-- markers -->
  <text x="20"  y="80" font-family="Inter,sans-serif" font-size="11" fill="#a78bfa">Birth</text>
  <text x="185" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#a78bfa">25</text>
  <text x="350" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#a78bfa">50 yrs</text>
  <text x="515" y="80" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748b">75</text>
  <text x="620" y="80" text-anchor="end" font-family="Inter,sans-serif" font-size="11" fill="#64748b">100</text>
  <text x="320" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#475569">Life expectancy varies by country — Japan: 84 yrs · USA: 79 yrs · Global average: 73 yrs</text>
</svg>