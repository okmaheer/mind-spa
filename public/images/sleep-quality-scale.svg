<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="Sleep quality score scale: 0-4 very poor, 5-7 poor, 8-14 fair, 15-18 good, 19-21 excellent sleep quality">
  <rect width="640" height="110" fill="#f8fafc" rx="12"/>
  <rect x="20"  y="28" width="104" height="44" rx="6 0 0 6" fill="#ef4444"/>
  <rect x="124" y="28" width="112" height="44" fill="#fb923c"/>
  <rect x="236" y="28" width="144" height="44" fill="#facc15"/>
  <rect x="380" y="28" width="120" height="44" fill="#86efac"/>
  <rect x="500" y="28" width="120" height="44" rx="0 6 6 0" fill="#4ade80"/>
  <text x="72"  y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">0–4</text>
  <text x="72"  y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fee2e2">Very Poor</text>
  <text x="180" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">5–7</text>
  <text x="180" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#ffedd5">Poor</text>
  <text x="308" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#1e293b">8–14</text>
  <text x="308" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#713f12">Fair</text>
  <text x="440" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#1e293b">15–18</text>
  <text x="440" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#064e3b">Good</text>
  <text x="560" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">19–21</text>
  <text x="560" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#d1fae5">Excellent</text>
  <text x="320" y="90" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">Based on PSQI scoring framework · Sleep quality depends on duration, efficiency, and consistency</text>
</svg>