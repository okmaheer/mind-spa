<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Jet lag recovery time: 1 day per time zone crossed, travelling east is harder than west">
  <rect width="640" height="150" fill="#0f172a" rx="12"/>
  <text x="320" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Jet Lag Recovery — Days Needed per Time Zones Crossed</text>
  <!-- bars -->
  <rect x="60"  y="34" width="44" height="80" rx="4" fill="#4ade80"/>
  <rect x="120" y="54" width="44" height="60" rx="4" fill="#86efac"/>
  <rect x="180" y="64" width="44" height="50" rx="4" fill="#facc15"/>
  <rect x="240" y="74" width="44" height="40" rx="4" fill="#fb923c"/>
  <rect x="300" y="84" width="44" height="30" rx="4" fill="#f87171"/>
  <rect x="360" y="94" width="44" height="20" rx="4" fill="#ef4444"/>
  <!-- east vs west note -->
  <rect x="440" y="34" width="180" height="40" rx="6" fill="#1e3a5f"/>
  <text x="530" y="55" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#93c5fd">Eastward ✈ harder</text>
  <text x="530" y="68" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748b">~1.5 days/zone</text>
  <rect x="440" y="84" width="180" height="40" rx="6" fill="#1e293b"/>
  <text x="530" y="105" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#86efac">Westward ✈ easier</text>
  <text x="530" y="118" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#64748b">~1 day/zone</text>
  <!-- X labels -->
  <text x="82"  y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#4ade80">2 tz</text>
  <text x="142" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#86efac">4 tz</text>
  <text x="202" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#facc15">6 tz</text>
  <text x="262" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fb923c">8 tz</text>
  <text x="322" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#f87171">10 tz</text>
  <text x="382" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#ef4444">12 tz</text>
  <text x="320" y="145" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#475569">Light exposure, melatonin timing, and meal scheduling can cut recovery time by 30–50%</text>
</svg>