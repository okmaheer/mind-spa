<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Sleep cycle diagram showing 5 complete 90-minute cycles over 7.5 hours with REM stages">
  <rect width="640" height="200" fill="#0f172a" rx="12"/>
  <!-- axes -->
  <line x1="60" y1="150" x2="610" y2="150" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="30"  x2="60"  y2="150" stroke="#334155" stroke-width="1.5"/>
  <!-- Y labels -->
  <text x="54" y="38"  text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Awake</text>
  <text x="54" y="72"  text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">REM</text>
  <text x="54" y="106" text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Light</text>
  <text x="54" y="140" text-anchor="end" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">Deep</text>
  <!-- X labels (hours) -->
  <text x="60"  y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">0h</text>
  <text x="170" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">1.5h</text>
  <text x="280" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">3h</text>
  <text x="390" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">4.5h</text>
  <text x="500" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">6h</text>
  <text x="610" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">7.5h</text>
  <!-- cycle separators -->
  <line x1="170" y1="30" x2="170" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="30" x2="280" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="390" y1="30" x2="390" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="500" y1="30" x2="500" y2="150" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- cycle labels -->
  <text x="115" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6366f1">Cycle 1</text>
  <text x="225" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6366f1">Cycle 2</text>
  <text x="335" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6366f1">Cycle 3</text>
  <text x="445" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6366f1">Cycle 4</text>
  <text x="555" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#6366f1">Cycle 5</text>
  <!-- sleep wave path (simplified) -->
  <polyline points="60,38 80,140 110,70 140,140 170,38 190,140 220,70 250,140 280,42 300,140 330,75 360,140 390,48 410,140 440,80 470,140 500,55 530,140 560,88 590,140 610,140"
    fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- REM highlight dots -->
  <circle cx="110" cy="70"  r="4" fill="#a78bfa"/>
  <circle cx="220" cy="70"  r="4" fill="#a78bfa"/>
  <circle cx="330" cy="75"  r="4" fill="#a78bfa"/>
  <circle cx="440" cy="80"  r="4" fill="#a78bfa"/>
  <circle cx="560" cy="88"  r="4" fill="#a78bfa"/>
  <text x="320" y="18" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">90-Minute Sleep Cycles — 5 Cycles = 7.5 Hours</text>
</svg>