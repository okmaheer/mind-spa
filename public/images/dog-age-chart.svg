<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 155" width="640" height="155" role="img" aria-label="Dog to human age comparison chart by size: small dogs age slower than large dogs">
  <rect width="640" height="155" fill="#f8fafc" rx="12"/>
  <rect x="20" y="14" width="600" height="26" rx="4" fill="#1e293b"/>
  <text x="120" y="31" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">Dog Age</text>
  <text x="280" y="31" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">Small (&lt;10kg)</text>
  <text x="420" y="31" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">Medium (10–25kg)</text>
  <text x="570" y="31" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">Large (&gt;25kg)</text>
  <g font-family="Inter,sans-serif" font-size="12">
    <rect x="20" y="40"  width="600" height="22" fill="#f1f5f9"/>
    <text x="120" y="55" text-anchor="middle" fill="#1e293b">1 year</text>
    <text x="280" y="55" text-anchor="middle" fill="#059669" font-weight="600">15 human yrs</text>
    <text x="420" y="55" text-anchor="middle" fill="#d97706" font-weight="600">15 human yrs</text>
    <text x="570" y="55" text-anchor="middle" fill="#dc2626" font-weight="600">15 human yrs</text>
    <rect x="20" y="62"  width="600" height="22" fill="#fff"/>
    <text x="120" y="77" text-anchor="middle" fill="#1e293b">5 years</text>
    <text x="280" y="77" text-anchor="middle" fill="#059669" font-weight="600">36 human yrs</text>
    <text x="420" y="77" text-anchor="middle" fill="#d97706" font-weight="600">37 human yrs</text>
    <text x="570" y="77" text-anchor="middle" fill="#dc2626" font-weight="600">40 human yrs</text>
    <rect x="20" y="84"  width="600" height="22" fill="#f1f5f9"/>
    <text x="120" y="99" text-anchor="middle" fill="#1e293b">10 years</text>
    <text x="280" y="99" text-anchor="middle" fill="#059669" font-weight="600">56 human yrs</text>
    <text x="420" y="99" text-anchor="middle" fill="#d97706" font-weight="600">60 human yrs</text>
    <text x="570" y="99" text-anchor="middle" fill="#dc2626" font-weight="600">66 human yrs</text>
    <rect x="20" y="106" width="600" height="22" fill="#fff"/>
    <text x="120" y="121" text-anchor="middle" fill="#1e293b">15 years</text>
    <text x="280" y="121" text-anchor="middle" fill="#059669" font-weight="600">76 human yrs</text>
    <text x="420" y="121" text-anchor="middle" fill="#d97706" font-weight="600">83 human yrs</text>
    <text x="570" y="121" text-anchor="middle" fill="#dc2626" font-weight="600">93 human yrs</text>
  </g>
  <text x="320" y="146" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">Large dogs age faster — a 10-year Great Dane is equivalent to a 66-year-old human</text>
</svg>