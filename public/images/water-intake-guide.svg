<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Daily water intake guide: 2.7L for women, 3.7L for men, increase by 0.5L per hour of exercise">
  <rect width="640" height="160" fill="#f0f9ff" rx="12"/>
  <!-- glasses row -->
  <g transform="translate(60,20)">
    <!-- glass shape (simple rect with rounded bottom) -->
    <rect x="0"   y="0" width="52" height="70" rx="0 0 8 8" fill="#bae6fd" stroke="#38bdf8" stroke-width="2"/>
    <rect x="0"   y="0" width="52" height="14" rx="4 4 0 0" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
    <text x="26"  y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#0369a1">250ml</text>
    <text x="26"  y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#0369a1">1 glass</text>
  </g>
  <text x="128" y="62" font-family="Inter,sans-serif" font-size="22" fill="#94a3b8">×</text>
  <g transform="translate(148,20)">
    <rect x="0"   y="0" width="52" height="70" rx="0 0 8 8" fill="#6366f1" stroke="#4338ca" stroke-width="2"/>
    <rect x="0"   y="0" width="52" height="14" rx="4 4 0 0" fill="#818cf8" stroke="#4338ca" stroke-width="2"/>
    <text x="26"  y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#fff">8–15</text>
    <text x="26"  y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#6366f1">glasses</text>
  </g>
  <text x="216" y="62" font-family="Inter,sans-serif" font-size="22" fill="#94a3b8">=</text>
  <g transform="translate(236,20)">
    <rect x="0"   y="0" width="52" height="70" rx="0 0 8 8" fill="#34d399" stroke="#059669" stroke-width="2"/>
    <rect x="0"   y="0" width="52" height="14" rx="4 4 0 0" fill="#6ee7b7" stroke="#059669" stroke-width="2"/>
    <text x="26"  y="44" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#fff">2–4L</text>
    <text x="26"  y="86" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#059669">per day</text>
  </g>
  <!-- info boxes -->
  <rect x="340" y="20" width="130" height="70" rx="8" fill="#dbeafe"/>
  <text x="405" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">Women</text>
  <text x="405" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">2.7 L</text>
  <text x="405" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#3b82f6">AI recommendation</text>
  <rect x="490" y="20" width="130" height="70" rx="8" fill="#e0f2fe"/>
  <text x="555" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#0369a1">Men</text>
  <text x="555" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="18" font-weight="700" fill="#0369a1">3.7 L</text>
  <text x="555" y="78" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#0284c7">AI recommendation</text>
  <text x="320" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748b">Add 0.5L per hour of exercise · More in hot weather · Less if eating water-rich foods</text>
</svg>