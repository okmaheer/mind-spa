<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 120" width="640" height="120" role="img" aria-label="TDEE formula: BMR multiplied by activity factor equals total daily energy expenditure">
  <rect width="640" height="120" fill="#f8fafc" rx="12"/>
  <rect x="20"  y="30" width="160" height="56" rx="8" fill="#6366f1"/>
  <text x="100" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">BMR</text>
  <text x="100" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#c7d2fe">Basal Metabolic Rate</text>
  <text x="210" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" fill="#94a3b8">×</text>
  <rect x="240" y="30" width="160" height="56" rx="8" fill="#34d399"/>
  <text x="320" y="55" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">Activity Factor</text>
  <text x="320" y="70" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#d1fae5">1.2 → 1.9</text>
  <text x="320" y="83" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#d1fae5">sedentary → very active</text>
  <text x="430" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="28" fill="#94a3b8">=</text>
  <rect x="455" y="30" width="160" height="56" rx="8" fill="#f59e0b"/>
  <text x="535" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">TDEE</text>
  <text x="535" y="76" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fef3c7">Total Daily Calories</text>
  <text x="320" y="108" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">Mifflin-St Jeor equation — most validated formula for TDEE estimation</text>
</svg>