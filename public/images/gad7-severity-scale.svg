<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="GAD-7 anxiety severity scale: 0-4 minimal, 5-9 mild, 10-14 moderate, 15-21 severe anxiety">
  <rect width="640" height="110" fill="#f8fafc" rx="12"/>
  <rect x="20"  y="28" width="130" height="44" rx="6 0 0 6" fill="#4ade80"/>
  <rect x="150" y="28" width="155" height="44" fill="#facc15"/>
  <rect x="305" y="28" width="155" height="44" fill="#fb923c"/>
  <rect x="460" y="28" width="160" height="44" rx="0 6 6 0" fill="#ef4444"/>
  <text x="85"  y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">0–4</text>
  <text x="85"  y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#d1fae5">Minimal</text>
  <text x="228" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">5–9</text>
  <text x="228" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fef9c3">Mild Anxiety</text>
  <text x="383" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">10–14</text>
  <text x="383" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#ffedd5">Moderate</text>
  <text x="540" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">15–21</text>
  <text x="540" y="63" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fee2e2">Severe Anxiety</text>
  <text x="320" y="90" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">GAD-7 is a screening tool only — scores ≥ 10 suggest professional consultation is recommended</text>
</svg>