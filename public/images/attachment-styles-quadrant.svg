<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Attachment styles quadrant: secure top-right, anxious top-left, avoidant bottom-right, disorganized bottom-left based on anxiety and avoidance axes">
  <rect width="640" height="300" fill="#f8fafc" rx="12"/>
  <!-- axes -->
  <line x1="320" y1="20"  x2="320" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="20"  y1="150" x2="620" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <!-- axis labels -->
  <text x="320" y="14"  text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748b">High Anxiety</text>
  <text x="320" y="294" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#64748b">Low Anxiety</text>
  <text x="12"  y="153" font-family="Inter,sans-serif" font-size="11" fill="#64748b">High Avoid.</text>
  <text x="560" y="153" font-family="Inter,sans-serif" font-size="11" fill="#64748b">Low Avoid.</text>
  <!-- quadrant fills -->
  <rect x="21"  y="21"  width="298" height="128" rx="6" fill="#fef2f2" opacity="0.8"/>
  <rect x="321" y="21"  width="298" height="128" rx="6" fill="#f0fdf4" opacity="0.8"/>
  <rect x="21"  y="151" width="298" height="128" rx="6" fill="#eff6ff" opacity="0.8"/>
  <rect x="321" y="151" width="298" height="128" rx="6" fill="#faf5ff" opacity="0.8"/>
  <!-- quadrant content -->
  <text x="170" y="70"  text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#dc2626">😰 Anxious</text>
  <text x="170" y="90"  text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#7f1d1d">High anxiety + High avoidance</text>
  <text x="170" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#991b1b">Fears rejection, pushes away</text>
  <text x="170" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#b91c1c">= Disorganized / Fearful</text>
  <text x="470" y="70"  text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#16a34a">😊 Secure</text>
  <text x="470" y="90"  text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#14532d">Low anxiety + Low avoidance</text>
  <text x="470" y="106" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#15803d">Comfortable with closeness</text>
  <text x="470" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#166534">Trusts, communicates well</text>
  <text x="170" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#2563eb">🏃 Avoidant</text>
  <text x="170" y="215" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#1e3a8a">Low anxiety + High avoidance</text>
  <text x="170" y="231" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#1d4ed8">Values independence over closeness</text>
  <text x="170" y="247" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#1e40af">= Dismissive-Avoidant</text>
  <text x="470" y="195" text-anchor="middle" font-family="Inter,sans-serif" font-size="16" font-weight="700" fill="#7c3aed">💭 Anxious-Preoccupied</text>
  <text x="470" y="215" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#4c1d95">High anxiety + Low avoidance</text>
  <text x="470" y="231" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#6d28d9">Craves closeness, fears loss</text>
  <text x="470" y="247" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#7c3aed">= Preoccupied-Anxious</text>
</svg>