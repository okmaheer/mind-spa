<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="Pomodoro technique: 4 cycles of 25 minutes work followed by 5 minute break, then a 15-30 minute long break">
  <rect width="640" height="110" fill="#f8fafc" rx="12"/>
  <!-- 4 pomodoro cycles -->
  <rect x="20"  y="28" width="95" height="36" rx="4" fill="#ef4444"/>
  <text x="68"  y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">🍅 25m</text>
  <rect x="119" y="28" width="38" height="36" rx="4" fill="#34d399"/>
  <text x="138" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff">5m</text>
  <rect x="161" y="28" width="95" height="36" rx="4" fill="#ef4444"/>
  <text x="209" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">🍅 25m</text>
  <rect x="260" y="28" width="38" height="36" rx="4" fill="#34d399"/>
  <text x="279" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff">5m</text>
  <rect x="302" y="28" width="95" height="36" rx="4" fill="#ef4444"/>
  <text x="350" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">🍅 25m</text>
  <rect x="401" y="28" width="38" height="36" rx="4" fill="#34d399"/>
  <text x="420" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#fff">5m</text>
  <rect x="443" y="28" width="95" height="36" rx="4" fill="#ef4444"/>
  <text x="491" y="50" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#fff">🍅 25m</text>
  <text x="554" y="42" font-family="Inter,sans-serif" font-size="18" fill="#94a3b8">→</text>
  <rect x="572" y="28" width="56" height="36" rx="4" fill="#6366f1"/>
  <text x="600" y="46" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#fff">Long</text>
  <text x="600" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#c7d2fe">15–30m</text>
  <!-- labels -->
  <text x="116"  y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#ef4444">Work</text>
  <text x="138"  y="82" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#34d399">Break</text>
  <text x="320" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">4 pomodoros = ~2 hours of focused work · Long break after every 4th cycle</text>
</svg>