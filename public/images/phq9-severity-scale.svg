<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 110" width="640" height="110" role="img" aria-label="PHQ-9 depression severity scale: 0-4 minimal, 5-9 mild, 10-14 moderate, 15-19 moderately severe, 20-27 severe">
  <rect width="640" height="110" fill="#f8fafc" rx="12"/>
  <rect x="20"  y="28" width="108" height="44" rx="6 0 0 6" fill="#4ade80"/>
  <rect x="128" y="28" width="118" height="44" fill="#facc15"/>
  <rect x="246" y="28" width="118" height="44" fill="#fb923c"/>
  <rect x="364" y="28" width="126" height="44" fill="#f87171"/>
  <rect x="490" y="28" width="130" height="44" rx="0 6 6 0" fill="#ef4444"/>
  <text x="74"  y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">0–4</text>
  <text x="74"  y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#d1fae5">Minimal</text>
  <text x="187" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">5–9</text>
  <text x="187" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fef9c3">Mild</text>
  <text x="305" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">10–14</text>
  <text x="305" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#ffedd5">Moderate</text>
  <text x="427" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">15–19</text>
  <text x="427" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fee2e2">Mod. Severe</text>
  <text x="555" y="48" text-anchor="middle" font-family="Inter,sans-serif" font-size="12" font-weight="700" fill="#fff">20–27</text>
  <text x="555" y="62" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#fee2e2">Severe</text>
  <text x="320" y="90" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#94a3b8">PHQ-9 is a screening tool — not a diagnosis · Scores ≥ 10 recommend professional evaluation</text>
</svg>